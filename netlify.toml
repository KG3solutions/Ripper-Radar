[build]
  command = "cd gen-share && npm install && npm run build && cd .. && mkdir -p generator-share && cp -r gen-share/build/* generator-share/"
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

# Scheduled function for outage data (runs hourly - Netlify free tier minimum)
# For 30-min updates, can trigger via external cron service hitting /api/outage-data
[functions."outage-data-agent"]
  schedule = "@hourly"

[[headers]]
  for = "/netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# SPA fallback for Generator Share app (only when no file exists)
[[redirects]]
  from = "/generator-share/*"
  to = "/generator-share/index.html"
  status = 200
  force = false
