<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XW7PRQVCJB"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-XW7PRQVCJB');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>NES Outage Map | RIPPER RADAR</title>

    <!-- Open Graph -->
    <meta property="og:title" content="NES Outage Map | RIPPER RADAR">
    <meta property="og:description" content="Interactive map showing NES power outages vs restored areas. Search your address to see your status.">

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Outage Map">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            padding: 10px 12px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 1px solid #334155;
            z-index: 1000;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 700;
            color: #f1f5f9;
        }

        .back-link {
            font-size: 11px;
            color: #60a5fa;
            text-decoration: none;
        }

        /* Search */
        .search-container {
            display: flex;
            gap: 8px;
        }

        .search-input {
            flex: 1;
            padding: 10px 12px;
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #60a5fa;
        }

        .search-input::placeholder {
            color: #64748b;
        }

        .search-btn {
            padding: 10px 16px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
        }

        .search-btn:active {
            background-color: #2563eb;
        }

        .search-btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        /* Map Container */
        .map-container {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Legend */
        .legend {
            position: absolute;
            bottom: 20px;
            left: 10px;
            background: rgba(15, 23, 42, 0.95);
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            z-index: 1000;
            font-size: 12px;
        }

        .legend-title {
            font-weight: 600;
            margin-bottom: 6px;
            color: #f1f5f9;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }

        .legend-color.red { background-color: #ef4444; }
        .legend-color.green { background-color: #22c55e; }

        /* Controls */
        .controls {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(15, 23, 42, 0.95);
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            z-index: 1000;
        }

        .control-label {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .opacity-slider {
            width: 120px;
            height: 6px;
            -webkit-appearance: none;
            background: #334155;
            border-radius: 3px;
            outline: none;
        }

        .opacity-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #3b82f6;
            border-radius: 50%;
            cursor: pointer;
        }

        .opacity-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: #3b82f6;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        /* Location marker popup */
        .leaflet-popup-content-wrapper {
            background: #1e293b;
            color: #f1f5f9;
            border-radius: 8px;
        }

        .leaflet-popup-tip {
            background: #1e293b;
        }

        .popup-content {
            font-family: 'Inter', sans-serif;
            padding: 4px;
        }

        .popup-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .popup-coords {
            font-size: 11px;
            color: #94a3b8;
        }

        /* Loading */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95);
            padding: 16px 24px;
            border-radius: 8px;
            border: 1px solid #334155;
            z-index: 2000;
            display: none;
        }

        .loading.show {
            display: block;
        }

        /* Status indicator */
        .status-badge {
            position: absolute;
            bottom: 20px;
            right: 10px;
            background: rgba(15, 23, 42, 0.95);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            z-index: 1000;
            font-size: 11px;
            color: #94a3b8;
        }

        /* Locate button */
        .locate-btn {
            position: absolute;
            bottom: 80px;
            right: 10px;
            width: 40px;
            height: 40px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #334155;
            border-radius: 8px;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
        }

        .locate-btn:active {
            background: #334155;
        }

        /* Calibration */
        .calibrate-toggle {
            margin-top: 8px;
            padding: 6px 10px;
            background: #334155;
            border: none;
            border-radius: 4px;
            color: #94a3b8;
            font-size: 10px;
            cursor: pointer;
            width: 100%;
        }

        .calibrate-panel {
            display: none;
            position: absolute;
            top: 80px;
            right: 10px;
            background: rgba(15, 23, 42, 0.95);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            z-index: 1000;
            width: 160px;
        }

        .calibrate-panel.show {
            display: block;
        }

        .calibrate-title {
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #f1f5f9;
        }

        .calibrate-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        .calibrate-row label {
            font-size: 10px;
            color: #94a3b8;
            width: 40px;
        }

        .calibrate-row input {
            flex: 1;
            padding: 4px 6px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 4px;
            color: #f1f5f9;
            font-size: 11px;
            width: 80px;
        }

        .calibrate-btn {
            flex: 1;
            padding: 6px;
            background: #3b82f6;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 10px;
            cursor: pointer;
        }

        /* Mobile adjustments */
        @media (max-width: 480px) {
            .controls {
                top: auto;
                bottom: 120px;
                right: 10px;
            }

            .legend {
                bottom: 60px;
            }

            .status-badge {
                bottom: 16px;
                left: 10px;
                right: auto;
            }

            .calibrate-panel {
                top: auto;
                bottom: 180px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <h1>NES Outage Map</h1>
            <a href="/nes-dashboard" class="back-link">Dashboard &rarr;</a>
        </div>
        <div class="search-container">
            <input type="text" class="search-input" id="address-input" placeholder="Enter your address..." autocomplete="off">
            <button class="search-btn" id="search-btn" onclick="searchAddress()">Find</button>
        </div>
    </div>

    <div class="map-container">
        <div id="map"></div>

        <div class="legend">
            <div class="legend-title">Power Status</div>
            <div class="legend-item">
                <div class="legend-color red"></div>
                <span>Out</span>
            </div>
            <div class="legend-item">
                <div class="legend-color green"></div>
                <span>Restored</span>
            </div>
        </div>

        <div class="controls">
            <div class="control-label">Overlay Opacity</div>
            <input type="range" class="opacity-slider" id="opacity-slider" min="0" max="100" value="70" oninput="updateOpacity(this.value)">
            <button class="calibrate-toggle" onclick="toggleCalibrate()">Calibrate</button>
        </div>

        <div class="calibrate-panel" id="calibrate-panel">
            <div class="calibrate-title">Adjust Overlay Bounds</div>
            <div class="calibrate-row">
                <label>North:</label>
                <input type="number" id="cal-north" step="0.01" onchange="updateBounds()">
            </div>
            <div class="calibrate-row">
                <label>South:</label>
                <input type="number" id="cal-south" step="0.01" onchange="updateBounds()">
            </div>
            <div class="calibrate-row">
                <label>East:</label>
                <input type="number" id="cal-east" step="0.01" onchange="updateBounds()">
            </div>
            <div class="calibrate-row">
                <label>West:</label>
                <input type="number" id="cal-west" step="0.01" onchange="updateBounds()">
            </div>
            <div class="calibrate-row">
                <button class="calibrate-btn" onclick="copyBoundsUrl()">Copy URL</button>
                <button class="calibrate-btn" onclick="resetBounds()">Reset</button>
            </div>
        </div>

        <div class="locate-btn" onclick="locateMe()">
            📍
        </div>

        <div class="status-badge">
            Jan 28, 2026 • Data from NES
        </div>

        <div class="loading" id="loading">Searching...</div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Nashville center
        const nashvilleCenter = [36.1627, -86.7816];

        // Image bounds - calibrated using Briley Parkway (155) as reference
        // Briley NW at I-24: ~36.23, -86.84 | Briley E at Opryland: ~36.21, -86.66
        // Adjustable via URL params: ?swLat=X&swLng=X&neLat=X&neLng=X
        const urlParams = new URLSearchParams(window.location.search);
        const imageBounds = [
            [
                parseFloat(urlParams.get('swLat')) || 35.90,   // Southwest lat
                parseFloat(urlParams.get('swLng')) || -87.00   // Southwest lng
            ],
            [
                parseFloat(urlParams.get('neLat')) || 36.42,   // Northeast lat
                parseFloat(urlParams.get('neLng')) || -86.45   // Northeast lng
            ]
        ];

        // Initialize map
        const map = L.map('map', {
            center: nashvilleCenter,
            zoom: 11,
            minZoom: 9,
            maxZoom: 18,
            zoomControl: true
        });

        // Add base tile layer (dark style)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        // Add outage overlay
        const outageOverlay = L.imageOverlay('assets/nes-outage-map.jpeg', imageBounds, {
            opacity: 0.7,
            interactive: false
        }).addTo(map);

        // Current marker
        let currentMarker = null;

        // Update opacity
        function updateOpacity(value) {
            outageOverlay.setOpacity(value / 100);
        }

        // Search address using Nominatim
        async function searchAddress() {
            const input = document.getElementById('address-input');
            const btn = document.getElementById('search-btn');
            const loading = document.getElementById('loading');
            const address = input.value.trim();

            if (!address) {
                input.focus();
                return;
            }

            // Add Nashville context if not present
            let searchQuery = address;
            if (!address.toLowerCase().includes('nashville') &&
                !address.toLowerCase().includes('tennessee') &&
                !address.toLowerCase().includes('tn')) {
                searchQuery = address + ', Nashville, TN';
            }

            btn.disabled = true;
            loading.classList.add('show');

            try {
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchQuery)}&limit=1&countrycodes=us`,
                    { headers: { 'User-Agent': 'RipperRadar/1.0' } }
                );
                const results = await response.json();

                if (results.length > 0) {
                    const result = results[0];
                    const lat = parseFloat(result.lat);
                    const lon = parseFloat(result.lon);

                    // Remove existing marker
                    if (currentMarker) {
                        map.removeLayer(currentMarker);
                    }

                    // Add new marker
                    currentMarker = L.marker([lat, lon]).addTo(map);
                    currentMarker.bindPopup(`
                        <div class="popup-content">
                            <div class="popup-title">📍 Your Location</div>
                            <div class="popup-coords">${result.display_name.split(',').slice(0, 3).join(',')}</div>
                        </div>
                    `).openPopup();

                    // Zoom to location
                    map.setView([lat, lon], 15);
                } else {
                    alert('Address not found. Try adding more details or zip code.');
                }
            } catch (error) {
                console.error('Search error:', error);
                alert('Search failed. Please try again.');
            } finally {
                btn.disabled = false;
                loading.classList.remove('show');
            }
        }

        // Enter key to search
        document.getElementById('address-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchAddress();
            }
        });

        // Locate me using GPS
        function locateMe() {
            const loading = document.getElementById('loading');
            loading.classList.add('show');

            if (!navigator.geolocation) {
                alert('Geolocation not supported by your browser');
                loading.classList.remove('show');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    // Remove existing marker
                    if (currentMarker) {
                        map.removeLayer(currentMarker);
                    }

                    // Add new marker
                    currentMarker = L.marker([lat, lon]).addTo(map);
                    currentMarker.bindPopup(`
                        <div class="popup-content">
                            <div class="popup-title">📍 Your Location</div>
                            <div class="popup-coords">${lat.toFixed(5)}, ${lon.toFixed(5)}</div>
                        </div>
                    `).openPopup();

                    // Zoom to location
                    map.setView([lat, lon], 15);
                    loading.classList.remove('show');
                },
                function(error) {
                    loading.classList.remove('show');
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            alert('Location permission denied. Please enable location access.');
                            break;
                        case error.POSITION_UNAVAILABLE:
                            alert('Location unavailable. Try searching your address instead.');
                            break;
                        case error.TIMEOUT:
                            alert('Location request timed out. Please try again.');
                            break;
                        default:
                            alert('Unable to get location. Try searching your address instead.');
                    }
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // Fit to overlay bounds on load
        map.fitBounds(imageBounds);

        // ============ CALIBRATION ============
        const defaultBounds = {
            south: 35.90,
            north: 36.42,
            west: -87.00,
            east: -86.45
        };

        // Initialize calibration inputs
        document.getElementById('cal-north').value = imageBounds[1][0];
        document.getElementById('cal-south').value = imageBounds[0][0];
        document.getElementById('cal-east').value = imageBounds[1][1];
        document.getElementById('cal-west').value = imageBounds[0][1];

        function toggleCalibrate() {
            document.getElementById('calibrate-panel').classList.toggle('show');
        }

        function updateBounds() {
            const north = parseFloat(document.getElementById('cal-north').value);
            const south = parseFloat(document.getElementById('cal-south').value);
            const east = parseFloat(document.getElementById('cal-east').value);
            const west = parseFloat(document.getElementById('cal-west').value);

            if (north && south && east && west) {
                const newBounds = [[south, west], [north, east]];
                outageOverlay.setBounds(newBounds);
            }
        }

        function copyBoundsUrl() {
            const north = document.getElementById('cal-north').value;
            const south = document.getElementById('cal-south').value;
            const east = document.getElementById('cal-east').value;
            const west = document.getElementById('cal-west').value;

            const url = `${window.location.origin}/outage-map?swLat=${south}&swLng=${west}&neLat=${north}&neLng=${east}`;
            navigator.clipboard.writeText(url).then(() => {
                alert('URL copied! Share this link or update the default bounds.');
            });
        }

        function resetBounds() {
            document.getElementById('cal-north').value = defaultBounds.north;
            document.getElementById('cal-south').value = defaultBounds.south;
            document.getElementById('cal-east').value = defaultBounds.east;
            document.getElementById('cal-west').value = defaultBounds.west;
            updateBounds();
        }
    </script>
</body>
</html>
