<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XW7PRQVCJB"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Live NES Outage Map | RIPPER RADAR</title>

    <!-- Open Graph -->
    <meta property="og:title" content="Live NES Outage Map | RIPPER RADAR">
    <meta property="og:description" content="Real-time NES power outage map. See crew status, outage duration, and get alerts when your power is restored.">

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NES Outages">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            padding: 12px 16px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 1px solid #334155;
            z-index: 1000;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #22c55e;
            color: #0f172a;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .live-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #0f172a;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .nav-links {
            display: flex;
            gap: 12px;
            font-size: 12px;
        }

        .nav-links a {
            color: #60a5fa;
            text-decoration: none;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .stat-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #1e293b;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
            border: 1px solid #334155;
        }

        .stat-chip .value {
            font-weight: 700;
            color: #f1f5f9;
        }

        .stat-chip .label {
            color: #94a3b8;
        }

        .stat-chip.danger { border-color: #ef4444; }
        .stat-chip.danger .value { color: #ef4444; }
        .stat-chip.warning { border-color: #f59e0b; }
        .stat-chip.warning .value { color: #f59e0b; }
        .stat-chip.success { border-color: #22c55e; }
        .stat-chip.success .value { color: #22c55e; }

        /* Main Layout */
        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-section {
            padding: 16px;
            border-bottom: 1px solid #334155;
        }

        .sidebar-title {
            font-size: 11px;
            font-weight: 700;
            color: #f59e0b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        /* Address Search */
        .address-input-group {
            display: flex;
            gap: 8px;
        }

        .address-input {
            flex: 1;
            padding: 10px 12px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 13px;
            font-family: inherit;
            outline: none;
        }

        .address-input:focus {
            border-color: #3b82f6;
        }

        .address-input::placeholder {
            color: #64748b;
        }

        .search-btn {
            padding: 10px 14px;
            background: #3b82f6;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .search-btn:hover {
            background: #2563eb;
        }

        /* Alert Panel */
        .alert-panel {
            margin-top: 12px;
            padding: 12px;
            background: #0f172a;
            border-radius: 8px;
            border: 1px solid #334155;
            display: none;
        }

        .alert-panel.show {
            display: block;
        }

        .alert-panel.has-power {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.1);
        }

        .alert-panel.no-power {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        .alert-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .alert-status-icon {
            font-size: 20px;
        }

        .alert-details {
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.5;
        }

        .alert-actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
        }

        .alert-btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        .alert-btn.primary {
            background: #8b5cf6;
            color: white;
        }

        .alert-btn.secondary {
            background: #334155;
            color: #f1f5f9;
        }

        /* Cause Breakdown */
        .cause-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .cause-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: #0f172a;
            border-radius: 6px;
            font-size: 12px;
        }

        .cause-name {
            color: #f1f5f9;
        }

        .cause-stats {
            display: flex;
            gap: 12px;
            color: #94a3b8;
        }

        .cause-stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Outage List */
        .outage-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .outage-item {
            padding: 12px;
            background: #0f172a;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid #ef4444;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .outage-item:hover {
            transform: translateX(4px);
        }

        .outage-item.assigned {
            border-left-color: #f59e0b;
        }

        .outage-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .outage-affected {
            font-size: 16px;
            font-weight: 700;
            color: #f1f5f9;
        }

        .outage-status {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        .outage-status.unassigned {
            background: #ef4444;
            color: white;
        }

        .outage-status.assigned {
            background: #f59e0b;
            color: #0f172a;
        }

        .outage-meta {
            font-size: 11px;
            color: #94a3b8;
            display: flex;
            gap: 12px;
        }

        /* Map Container */
        .map-container {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Map Controls */
        .map-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1000;
        }

        .map-btn {
            width: 40px;
            height: 40px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .map-btn:hover {
            background: #334155;
        }

        .map-btn.active {
            background: #3b82f6;
            border-color: #3b82f6;
        }

        /* Legend */
        .map-legend {
            position: absolute;
            bottom: 20px;
            left: 10px;
            background: rgba(15, 23, 42, 0.95);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            z-index: 1000;
            font-size: 11px;
        }

        .legend-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: #f1f5f9;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .legend-dot.unassigned { background: #ef4444; }
        .legend-dot.assigned { background: #f59e0b; }
        .legend-dot.long { background: #8b5cf6; }

        /* Update time */
        .update-time {
            position: absolute;
            bottom: 20px;
            right: 10px;
            background: rgba(15, 23, 42, 0.95);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            z-index: 1000;
            font-size: 11px;
            color: #94a3b8;
        }

        /* Loading */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .loading-overlay.hidden {
            display: none;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #334155;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Mobile */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                width: 100%;
                z-index: 1500;
            }

            .sidebar.show {
                display: flex;
            }

            .sidebar-close {
                display: block;
                position: absolute;
                top: 10px;
                right: 10px;
                width: 32px;
                height: 32px;
                background: #334155;
                border: none;
                border-radius: 6px;
                color: #f1f5f9;
                font-size: 18px;
                cursor: pointer;
            }

            .mobile-toggle {
                display: flex;
            }

            .stats-bar {
                display: none;
            }

            .header h1 {
                font-size: 16px;
            }
        }

        @media (min-width: 769px) {
            .sidebar-close {
                display: none;
            }

            .mobile-toggle {
                display: none;
            }
        }

        /* Custom marker styles */
        .outage-marker {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .outage-marker.unassigned { background: #ef4444; }
        .outage-marker.assigned { background: #f59e0b; color: #0f172a; }
        .outage-marker.long { background: #8b5cf6; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <h1>
                NES Outage Map
                <span class="live-badge">Live</span>
            </h1>
            <div class="nav-links">
                <a href="/nes-dashboard">Dashboard</a>
                <a href="/">Ripper Radar</a>
            </div>
        </div>
        <div class="stats-bar" id="stats-bar">
            <div class="stat-chip danger">
                <span class="value" id="stat-outages">--</span>
                <span class="label">Outages</span>
            </div>
            <div class="stat-chip danger">
                <span class="value" id="stat-affected">--</span>
                <span class="label">Affected</span>
            </div>
            <div class="stat-chip warning">
                <span class="value" id="stat-unassigned">--</span>
                <span class="label">No Crew</span>
            </div>
            <div class="stat-chip success">
                <span class="value" id="stat-assigned">--</span>
                <span class="label">Crew Assigned</span>
            </div>
            <div class="stat-chip">
                <span class="value" id="stat-avg-duration">--</span>
                <span class="label">Avg Duration</span>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="sidebar" id="sidebar">
            <button class="sidebar-close" onclick="toggleSidebar()">×</button>

            <!-- Address Search -->
            <div class="sidebar-section">
                <div class="sidebar-title">Check Your Address</div>
                <div class="address-input-group">
                    <input type="text" class="address-input" id="address-input" placeholder="Enter your address...">
                    <button class="search-btn" onclick="searchAddress()">🔍</button>
                </div>

                <div class="alert-panel" id="alert-panel">
                    <div class="alert-status">
                        <span class="alert-status-icon" id="alert-icon">⚡</span>
                        <span id="alert-text">Checking...</span>
                    </div>
                    <div class="alert-details" id="alert-details"></div>
                    <div class="alert-actions">
                        <button class="alert-btn primary" id="alert-notify-btn" onclick="enableNotifications()">
                            🔔 Notify When Restored
                        </button>
                        <button class="alert-btn secondary" onclick="clearAddress()">Clear</button>
                    </div>
                </div>
            </div>

            <!-- Cause Breakdown -->
            <div class="sidebar-section">
                <div class="sidebar-title">Outage Causes</div>
                <div class="cause-list" id="cause-list">
                    <div class="cause-item">
                        <span class="cause-name">Loading...</span>
                    </div>
                </div>
            </div>

            <!-- Outage List -->
            <div class="outage-list-container">
                <div class="sidebar-title">Active Outages <span id="outage-count">(--)</span></div>
                <div id="outage-list">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>

        <div class="map-container">
            <div id="map"></div>

            <div class="map-controls">
                <button class="map-btn mobile-toggle" onclick="toggleSidebar()" title="Show List">☰</button>
                <button class="map-btn" onclick="locateMe()" title="My Location">📍</button>
                <button class="map-btn" id="heatmap-toggle" onclick="toggleHeatmap()" title="Toggle Heatmap">🔥</button>
                <button class="map-btn" onclick="refreshData()" title="Refresh">🔄</button>
            </div>

            <div class="map-legend">
                <div class="legend-title">Outage Status</div>
                <div class="legend-item">
                    <div class="legend-dot unassigned"></div>
                    <span>No Crew Assigned</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot assigned"></div>
                    <span>Crew Dispatched</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot long"></div>
                    <span>Long Outage (4h+)</span>
                </div>
            </div>

            <div class="update-time" id="update-time">
                Loading...
            </div>

            <div class="loading-overlay" id="loading">
                <div class="loading-spinner"></div>
            </div>
        </div>
    </div>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Heatmap Plugin -->
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

    <!-- Initialize map when DOM is ready -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initLeafletMap();
        });
    </script>

    <script>
        // Global state
        let map = null;
        let markers = [];
        let outageData = null;
        let userMarker = null;
        let savedAddress = null;
        let notificationsEnabled = false;
        let heatmapLayer = null;
        let isLeaflet = true; // Using Leaflet (no API key required)
        let refreshInterval = null;

        // Nashville center
        const NASHVILLE = { lat: 36.1627, lng: -86.7816 };

        // Initialize Leaflet Map
        function initLeafletMap() {
            map = L.map('map').setView([NASHVILLE.lat, NASHVILLE.lng], 11);

            // Dark theme tile layer
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap, © CARTO',
                maxZoom: 19
            }).addTo(map);

            // Load saved address
            loadSavedAddress();

            // Fetch data
            fetchOutageData();

            // Auto-refresh every 2 minutes
            refreshInterval = setInterval(fetchOutageData, 2 * 60 * 1000);

            // Hide loading
            document.getElementById('loading').classList.add('hidden');
        }

        // Fetch outage data from our API (with fallback to direct API)
        async function fetchOutageData() {
            try {
                // Try our Netlify function first
                let response = await fetch('/api/nes-outages');

                // If that fails (local dev), try direct API
                if (!response.ok) {
                    console.log('Netlify API unavailable, trying direct NES API...');
                    response = await fetch('https://utilisocial.io/datacapable/v2/p/NES/map/events');

                    if (!response.ok) throw new Error('API error');

                    // Process raw data into our format
                    const rawData = await response.json();
                    outageData = processRawNESData(rawData);
                } else {
                    outageData = await response.json();
                }

                updateUI();
                updateMarkers();
                checkUserAddress();

            } catch (error) {
                console.error('Failed to fetch outage data:', error);
                document.getElementById('update-time').textContent = 'Error loading data';
                document.getElementById('cause-list').innerHTML = '<div style="color: #ef4444; padding: 12px;">Failed to load data. Try refreshing.</div>';
            }
        }

        // Process raw NES API data into our format (for local dev fallback)
        function processRawNESData(rawData) {
            const now = Date.now();
            const outages = (rawData || []).map(outage => ({
                id: outage.id,
                title: outage.title || 'Outage',
                status: outage.status || 'Unknown',
                numPeople: outage.numPeople || 0,
                cause: outage.cause || 'Unknown',
                latitude: outage.latitude,
                longitude: outage.longitude,
                startTime: outage.startTime,
                lastUpdatedTime: outage.lastUpdatedTime,
                durationMinutes: outage.startTime ? Math.round((now - outage.startTime) / 60000) : null,
                isAssigned: outage.status === 'Assigned',
                isLongOutage: outage.startTime ? (now - outage.startTime) > 4 * 3600000 : false
            }));

            // Calculate summary stats
            const totalOutages = outages.length;
            const totalAffected = outages.reduce((sum, o) => sum + o.numPeople, 0);
            const assignedOutages = outages.filter(o => o.isAssigned).length;

            // Group by cause
            const causeBreakdown = {};
            outages.forEach(o => {
                const cause = o.cause || 'Unknown';
                if (!causeBreakdown[cause]) {
                    causeBreakdown[cause] = { count: 0, affected: 0 };
                }
                causeBreakdown[cause].count++;
                causeBreakdown[cause].affected += o.numPeople;
            });

            return {
                timestamp: new Date().toISOString(),
                summary: {
                    totalOutages,
                    totalAffected,
                    assignedOutages,
                    crewCoveragePercent: totalOutages > 0 ? Math.round((assignedOutages / totalOutages) * 100) : 100
                },
                causeBreakdown,
                outages
            };
        }

        // Update UI with stats
        function updateUI() {
            if (!outageData) return;

            const s = outageData.summary;

            document.getElementById('stat-outages').textContent = s.totalOutages.toLocaleString();
            document.getElementById('stat-affected').textContent = formatNumber(s.totalAffected);
            document.getElementById('stat-unassigned').textContent = s.unassignedOutages.toLocaleString();
            document.getElementById('stat-assigned').textContent = s.assignedOutages.toLocaleString();
            document.getElementById('stat-avg-duration').textContent = formatDuration(s.avgDurationMinutes);
            document.getElementById('outage-count').textContent = `(${s.totalOutages})`;

            // Update time
            const time = new Date(outageData.timestamp);
            document.getElementById('update-time').textContent = `Updated ${time.toLocaleTimeString()}`;

            // Update cause breakdown
            updateCauseList();

            // Update outage list
            updateOutageList();
        }

        function formatNumber(num) {
            if (num >= 1000) return Math.round(num / 1000) + 'K';
            return num.toLocaleString();
        }

        function formatDuration(minutes) {
            if (minutes < 60) return minutes + 'm';
            const hours = Math.floor(minutes / 60);
            const mins = minutes % 60;
            return hours + 'h ' + mins + 'm';
        }

        // Update cause breakdown
        function updateCauseList() {
            const container = document.getElementById('cause-list');
            const causes = Object.entries(outageData.causeBreakdown)
                .sort((a, b) => b[1].affected - a[1].affected)
                .slice(0, 5);

            container.innerHTML = causes.map(([cause, data]) => `
                <div class="cause-item">
                    <span class="cause-name">${cause}</span>
                    <span class="cause-stats">
                        <span>⚡ ${data.count}</span>
                        <span>👥 ${formatNumber(data.affected)}</span>
                    </span>
                </div>
            `).join('');
        }

        // Update outage list in sidebar
        function updateOutageList() {
            const container = document.getElementById('outage-list');
            const outages = outageData.outages
                .sort((a, b) => b.numPeople - a.numPeople)
                .slice(0, 50);

            container.innerHTML = outages.map(o => `
                <div class="outage-item ${o.isAssigned ? 'assigned' : ''}" onclick="zoomToOutage(${o.latitude}, ${o.longitude})">
                    <div class="outage-item-header">
                        <span class="outage-affected">${o.numPeople.toLocaleString()} affected</span>
                        <span class="outage-status ${o.isAssigned ? 'assigned' : 'unassigned'}">
                            ${o.isAssigned ? '🛠 Crew Assigned' : '⏳ Waiting'}
                        </span>
                    </div>
                    <div class="outage-meta">
                        <span>⏱ ${formatDuration(o.durationMinutes || 0)}</span>
                        <span>📍 ${o.cause || 'Unknown cause'}</span>
                    </div>
                </div>
            `).join('');
        }

        // Update map markers
        function updateMarkers() {
            // Clear existing markers
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            if (!outageData || !outageData.outages) return;

            outageData.outages.forEach(outage => {
                const marker = createMarker(outage);
                markers.push(marker);
            });
        }

        // Create a marker for an outage
        function createMarker(outage) {
            // Determine color
            let color = '#ef4444'; // Red - unassigned
            if (outage.isAssigned) color = '#f59e0b'; // Yellow - assigned
            if (outage.isLongOutage) color = '#8b5cf6'; // Purple - long

            const marker = L.circleMarker([outage.latitude, outage.longitude], {
                radius: Math.min(8 + Math.sqrt(outage.numPeople) / 10, 20),
                fillColor: color,
                color: 'white',
                weight: 2,
                fillOpacity: 0.8
            }).addTo(map);

            marker.bindPopup(createPopupContent(outage));
            return marker;
        }

        // Create popup content for marker
        function createPopupContent(outage) {
            return `
                <div style="font-family: Inter, sans-serif; padding: 8px; min-width: 200px;">
                    <div style="font-size: 18px; font-weight: bold; margin-bottom: 8px;">
                        ${outage.numPeople.toLocaleString()} affected
                    </div>
                    <div style="margin-bottom: 4px;">
                        <strong>Status:</strong> ${outage.isAssigned ? '🛠 Crew Assigned' : '⏳ Waiting for Crew'}
                    </div>
                    <div style="margin-bottom: 4px;">
                        <strong>Cause:</strong> ${outage.cause || 'Unknown'}
                    </div>
                    <div style="margin-bottom: 4px;">
                        <strong>Duration:</strong> ${formatDuration(outage.durationMinutes || 0)}
                    </div>
                    <div style="font-size: 11px; color: #666; margin-top: 8px;">
                        Started: ${outage.startTime ? new Date(outage.startTime).toLocaleString() : 'Unknown'}
                    </div>
                </div>
            `;
        }

        // Zoom to specific outage
        function zoomToOutage(lat, lng) {
            map.setView([lat, lng], 15);
        }

        // Search address
        async function searchAddress() {
            const input = document.getElementById('address-input');
            const address = input.value.trim();

            if (!address) return;

            // Add Nashville context
            let searchQuery = address;
            if (!address.toLowerCase().includes('nashville') && !address.toLowerCase().includes('tn')) {
                searchQuery = address + ', Nashville, TN';
            }

            try {
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchQuery)}&limit=1`,
                    { headers: { 'User-Agent': 'RipperRadar/1.0' } }
                );
                const results = await response.json();

                if (results.length > 0) {
                    const result = results[0];
                    const lat = parseFloat(result.lat);
                    const lng = parseFloat(result.lon);

                    savedAddress = { lat, lng, address: result.display_name };
                    localStorage.setItem('nesAlertAddress', JSON.stringify(savedAddress));

                    addUserMarker(lat, lng);
                    checkUserAddress();

                    // Zoom to location
                    zoomToOutage(lat, lng);
                } else {
                    alert('Address not found. Try adding more details.');
                }
            } catch (error) {
                console.error('Geocoding error:', error);
                alert('Search failed. Please try again.');
            }
        }

        // Add user marker
        function addUserMarker(lat, lng) {
            if (userMarker) {
                map.removeLayer(userMarker);
            }

            userMarker = L.marker([lat, lng], {
                icon: L.divIcon({
                    className: 'user-marker',
                    html: '<div style="font-size: 24px;">📍</div>',
                    iconSize: [24, 24],
                    iconAnchor: [12, 24]
                })
            }).addTo(map);
        }

        // Check if user address is in outage zone
        function checkUserAddress() {
            if (!savedAddress || !outageData) return;

            const panel = document.getElementById('alert-panel');
            panel.classList.add('show');

            // Find nearest outage
            let nearestOutage = null;
            let nearestDistance = Infinity;

            outageData.outages.forEach(outage => {
                const dist = getDistance(savedAddress.lat, savedAddress.lng, outage.latitude, outage.longitude);
                if (dist < nearestDistance) {
                    nearestDistance = dist;
                    nearestOutage = outage;
                }
            });

            // If within 0.5 miles of an outage, assume affected
            const isAffected = nearestDistance < 0.5;

            const icon = document.getElementById('alert-icon');
            const text = document.getElementById('alert-text');
            const details = document.getElementById('alert-details');
            const notifyBtn = document.getElementById('alert-notify-btn');

            if (isAffected) {
                panel.classList.remove('has-power');
                panel.classList.add('no-power');
                icon.textContent = '⚠️';
                text.textContent = 'Likely Affected by Outage';
                details.innerHTML = `
                    <strong>Nearest outage:</strong> ${nearestOutage.numPeople.toLocaleString()} customers<br>
                    <strong>Status:</strong> ${nearestOutage.isAssigned ? '🛠 Crew Assigned' : '⏳ Waiting for Crew'}<br>
                    <strong>Duration:</strong> ${formatDuration(nearestOutage.durationMinutes || 0)}<br>
                    <strong>Cause:</strong> ${nearestOutage.cause || 'Unknown'}
                `;
                notifyBtn.style.display = 'block';
            } else {
                panel.classList.remove('no-power');
                panel.classList.add('has-power');
                icon.textContent = '✅';
                text.textContent = 'No Outage Detected';
                details.innerHTML = `Your area appears to have power.<br>Nearest outage: ${(nearestDistance).toFixed(1)} miles away`;
                notifyBtn.style.display = 'none';
            }

            // Check for power restoration notification
            if (notificationsEnabled && !isAffected) {
                showNotification('Power Restored!', 'Your area appears to have power restored.');
            }
        }

        // Calculate distance between two points (in miles)
        function getDistance(lat1, lng1, lat2, lng2) {
            const R = 3959; // Earth's radius in miles
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLng/2) * Math.sin(dLng/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Load saved address from localStorage
        function loadSavedAddress() {
            const saved = localStorage.getItem('nesAlertAddress');
            if (saved) {
                savedAddress = JSON.parse(saved);
                document.getElementById('address-input').value = savedAddress.address.split(',')[0];
                addUserMarker(savedAddress.lat, savedAddress.lng);
            }
        }

        // Clear saved address
        function clearAddress() {
            savedAddress = null;
            localStorage.removeItem('nesAlertAddress');
            document.getElementById('address-input').value = '';
            document.getElementById('alert-panel').classList.remove('show');
            if (userMarker) {
                map.removeLayer(userMarker);
                userMarker = null;
            }
        }

        // Enable browser notifications
        function enableNotifications() {
            if ('Notification' in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === 'granted') {
                        notificationsEnabled = true;
                        document.getElementById('alert-notify-btn').textContent = '🔔 Notifications Enabled';
                        document.getElementById('alert-notify-btn').disabled = true;
                        showNotification('Notifications Enabled', 'You will be notified when power is restored.');
                    }
                });
            }
        }

        // Show browser notification
        function showNotification(title, body) {
            if (Notification.permission === 'granted') {
                new Notification(title, {
                    body,
                    icon: '/assets/icon-192.png'
                });
            }
        }

        // Locate user
        function locateMe() {
            if (!navigator.geolocation) {
                alert('Geolocation not supported');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                position => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    savedAddress = { lat, lng, address: 'Your Location' };
                    addUserMarker(lat, lng);
                    zoomToOutage(lat, lng);
                    checkUserAddress();
                },
                error => {
                    alert('Unable to get location. Please enter your address manually.');
                }
            );
        }

        // Toggle sidebar on mobile
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('show');
        }

        // Toggle heatmap
        function toggleHeatmap() {
            const btn = document.getElementById('heatmap-toggle');

            if (!outageData || !outageData.outages) return;

            if (heatmapLayer) {
                // Remove heatmap
                map.removeLayer(heatmapLayer);
                heatmapLayer = null;
                btn.classList.remove('active');
            } else {
                // Create heatmap data: [lat, lng, intensity]
                const heatData = outageData.outages.map(o => [
                    o.latitude,
                    o.longitude,
                    Math.min(o.numPeople / 100, 10) // Scale intensity
                ]);

                heatmapLayer = L.heatLayer(heatData, {
                    radius: 25,
                    blur: 15,
                    maxZoom: 14,
                    gradient: {
                        0.2: '#22c55e',
                        0.4: '#f59e0b',
                        0.6: '#ef4444',
                        1.0: '#7c3aed'
                    }
                }).addTo(map);

                btn.classList.add('active');
            }
        }

        // Refresh data
        function refreshData() {
            document.getElementById('loading').classList.remove('hidden');
            fetchOutageData().then(() => {
                document.getElementById('loading').classList.add('hidden');
            });
        }

        // Enter key to search
        document.getElementById('address-input').addEventListener('keypress', e => {
            if (e.key === 'Enter') searchAddress();
        });
    </script>
</body>
</html>
