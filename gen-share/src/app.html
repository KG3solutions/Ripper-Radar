<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#2563EB" />
		<meta name="description" content="Connect neighbors with generators during power outages. No payments. Use at your own risk." />
		%sveltekit.head%
		<script>
			// Patch JSON.parse to handle HTML gracefully (for SvelteKit SPA fallback)
			const originalJSONParse = JSON.parse;
			JSON.parse = function(text, reviver) {
				if (typeof text === 'string' && text.trim().startsWith('<')) {
					console.warn('JSON.parse received HTML, returning empty object');
					return {};
				}
				return originalJSONParse.call(this, text, reviver);
			};
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
