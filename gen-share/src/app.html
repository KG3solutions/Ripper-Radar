<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#2563EB" />
		<meta name="description" content="Connect neighbors with generators during power outages. No payments. Use at your own risk." />
		%sveltekit.head%
		<script>
			window.onerror = function(msg, url, line, col, error) {
				document.body.innerHTML = '<div style="padding:20px;font-family:monospace;background:#fee;color:#c00;"><h2>JavaScript Error</h2><pre>' + msg + '\n\nFile: ' + url + '\nLine: ' + line + '</pre></div>';
				return false;
			};
			window.onunhandledrejection = function(event) {
				document.body.innerHTML = '<div style="padding:20px;font-family:monospace;background:#fee;color:#c00;"><h2>Promise Error</h2><pre>' + (event.reason?.message || event.reason || 'Unknown error') + '</pre></div>';
			};
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
