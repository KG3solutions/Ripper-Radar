<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#2563EB" />
		<meta name="description" content="Connect neighbors with generators during power outages. No payments. Use at your own risk." />
		%sveltekit.head%
		<script>
			// Intercept fetch to log requests
			const originalFetch = window.fetch;
			window.fetch = function(...args) {
				console.log('Fetch:', args[0]);
				return originalFetch.apply(this, args).catch(err => {
					console.error('Fetch failed:', args[0], err);
					throw err;
				});
			};
			window.onerror = function(msg, url, line, col, error) {
				document.body.innerHTML = '<div style="padding:20px;font-family:monospace;background:#fee;color:#c00;"><h2>JavaScript Error</h2><pre>' + msg + '\n\nFile: ' + url + '\nLine: ' + line + '</pre></div>';
				return false;
			};
			window.onunhandledrejection = function(event) {
				var stack = event.reason?.stack || '';
				document.body.innerHTML = '<div style="padding:20px;font-family:monospace;background:#fee;color:#c00;"><h2>Promise Error</h2><pre>' + (event.reason?.message || event.reason || 'Unknown error') + '\n\nStack:\n' + stack + '</pre></div>';
			};
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
